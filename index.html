<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="99lQwJ7oiggAkIQwyCH3ETALjHMl0dBipfRlVfEkBBc" />
    <title>Advanced Word & Character Counter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: #3498db;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }
        .stat-card {
            background: #3498db;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .stat-card p {
            font-size: 14px;
            opacity: 0.9;
        }
        .clear-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .clear-btn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Word & Character Counter</h1>
    <textarea id="textInput" placeholder="Yahan apna text type ya paste karein..."></textarea>
    
    <div class="stats-grid">
        <div class="stat-card" style="background: #3498db;">
            <h3 id="wordCount">0</h3>
            <p>Words</p>
        </div>
        <div class="stat-card" style="background: #2ecc71;">
            <h3 id="charCount">0</h3>
            <p>Characters</p>
        </div>
        <div class="stat-card" style="background: #e67e22;">
            <h3 id="sentenceCount">0</h3>
            <p>Sentences</p>
        </div>
        <div class="stat-card" style="background: #9b59b6;">
            <h3 id="readTime">0 min</h3>
            <p>Reading Time</p>
        </div>
    </div>

    <button class="clear-btn" onclick="clearText()">Clear Text</button>
</div>

<script>
    const textInput = document.getElementById('textInput');
    const wordCount = document.getElementById('wordCount');
    const charCount = document.getElementById('charCount');
    const sentenceCount = document.getElementById('sentenceCount');
    const readTime = document.getElementById('readTime');

    textInput.addEventListener('input', () => {
        const text = textInput.value.trim();

        // Character Count
        charCount.innerText = textInput.value.length;

        // Word Count
        const words = text === '' ? [] : text.split(/\s+/);
        wordCount.innerText = words.length;

        // Sentence Count
        const sentences = text === '' ? [] : text.split(/[.!?]+/).filter(Boolean);
        sentenceCount.innerText = sentences.length;

        // Reading Time (Average 200 words per minute)
        const minutes = words.length / 200;
        readTime.innerText = minutes < 1 ? Math.ceil(words.length / 200 * 60) + ' sec' : Math.ceil(minutes) + ' min';
    });

    function clearText() {
        textInput.value = '';
        wordCount.innerText = '0';
        charCount.innerText = '0';
        sentenceCount.innerText = '0';
        readTime.innerText = '0 min';
    }
</script>

</body>
</html>
